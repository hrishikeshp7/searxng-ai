name: searxng-ai

services:
  searxng:
    container_name: searxng-ai
    build:
      context: .
      dockerfile: Dockerfile
    image: searxng-ai:latest
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-}
      - SEARXNG_AI_OVERVIEW_BASE_URL=${SEARXNG_AI_OVERVIEW_BASE_URL:-}
      - SEARXNG_AI_OVERVIEW_API_KEY=${SEARXNG_AI_OVERVIEW_API_KEY:-}
      - SEARXNG_AI_OVERVIEW_MODEL=${SEARXNG_AI_OVERVIEW_MODEL:-}
      - SEARXNG_AI_OVERVIEW_TRIGGER_MODE=${SEARXNG_AI_OVERVIEW_TRIGGER_MODE:-auto}
      - SEARXNG_VALKEY_URL=valkey://valkey:6379/0
    env_file:
      - path: .env
        required: false
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
    depends_on:
      - valkey

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:
